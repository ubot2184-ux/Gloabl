<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج كاتلوج GLOBAL</title>
<style>
@font-face{font-family:NotoArabic;src:url(file:///usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf)}
@font-face{font-family:NotoArabic;src:url(file:///usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf);font-weight:700}
:root{--ink:#142333;--red:#ad1e2d;--line:#d7dce1;--soft:#f4f6f8}
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:var(--ink);font-family:NotoArabic,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 9px #14233312}.toolbar strong{margin-left:auto}.btn{border:0;border-radius:7px;padding:9px 14px;background:var(--ink);color:#fff;font:inherit;cursor:pointer}.btn.red{background:var(--red)}.btn.light{background:#e9edf1;color:var(--ink)}.hint{font-size:12px;color:#63707a;margin:8px 16px}.workspace{max-width:1100px;margin:14px auto;padding:0 14px}.editor{background:white;border:1px solid var(--line);border-radius:10px;margin:12px 0;padding:14px}.editor-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.editor-head b{background:var(--red);color:white;border-radius:18px;padding:3px 13px;direction:ltr}.editor-head button{margin-right:auto}.fields{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:9px}.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5b6670}.fields input,.fields select{width:100%;padding:8px;border:1px solid #ccd3d9;border-radius:6px;font:inherit;color:var(--ink);background:#fff}.fields .wide{grid-column:span 2}.image-field{display:flex;gap:8px;align-items:center}.image-field input{padding:5px}.empty{padding:38px;text-align:center;color:#66717c}
/* print/catalog layout */
.catalog{display:block;max-width:1100px;margin:14px auto;padding:0 14px}.catalog-page{width:210mm;height:297mm;background:#fff;padding:11mm 12mm 10mm;margin:14px auto;box-shadow:0 3px 16px #14233322;position:relative;overflow:hidden;break-after:page;page-break-after:always}.catalog-page:last-child{break-after:auto;page-break-after:auto}.top{height:26mm;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;margin-bottom:4mm}.brand{display:block;width:63mm;height:auto;max-height:20mm;object-fit:contain;object-position:left center}.catalog-title{text-align:right}.catalog-title .ar{font-size:18pt;font-weight:700}.catalog-title .en{font:8pt Arial,sans-serif;letter-spacing:2px;direction:ltr;color:#59636d}.redline{width:18mm;height:3px;background:var(--red);margin-top:2mm}.section-title{height:7mm;font-size:13pt;color:var(--red);font-weight:700;display:flex;align-items:center;gap:6px}.section-title input{border:0;border-bottom:1px dotted #aeb6be;font:inherit;color:inherit;background:transparent;width:65mm;outline:none}.catalog-section-input{border:0;border-bottom:1px solid #bdc4ca;font:inherit;padding:3px 6px;border-radius:3px;min-width:180px}.product-grid{height:228mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:4mm}.product-card{position:relative;border:1px solid #d5d9dd;border-radius:4mm;padding:3mm;background:#fff;display:flex;flex-direction:column;min-height:0}.item-code{align-self:center;min-width:35mm;text-align:center;direction:ltr;color:#fff;background:var(--red);border-radius:6mm;padding:1mm 4mm;font:700 12pt Arial,sans-serif}.product-image{width:100%;height:45mm;object-fit:contain;margin:2mm auto 1mm}.no-photo{height:45mm;display:flex;align-items:center;justify-content:center;color:#c1c7cd;font-size:11pt;margin:2mm auto 1mm}.product-name-ar{text-align:center;font-size:12pt;font-weight:700;line-height:1.4;min-height:9mm;margin-top:1mm}.product-name-en{text-align:center;font:9pt Arial,sans-serif;color:#58636e;min-height:5mm;margin-top:1mm}.measurements{text-align:center;font-size:8.5pt;color:#58636e;margin:1mm 0}.divider{border-top:1px solid var(--ink);margin:1mm 0 1.5mm}.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:1mm 3mm;font-size:8pt}.price-row{display:flex;justify-content:space-between;gap:2mm;border-bottom:1px solid #edf0f2;padding:.5mm 0}.price-label{color:#65707a}.price-value{direction:ltr;white-space:nowrap;font-weight:700}.pcs-row{position:relative;border:1px solid var(--ink);border-radius:2mm;height:13mm;margin-top:2mm;display:flex;align-items:center;justify-content:center}.pcs-value{font:700 18pt Arial,sans-serif;color:var(--red);direction:ltr}.pcs-caption{font-size:10pt;margin-right:2mm}.pcs-top{position:absolute;top:-4mm;left:4mm;background:#fff;padding:0 2mm;font:700 8pt Arial,sans-serif;color:var(--ink);direction:ltr}.footer{position:absolute;bottom:5mm;left:12mm;right:12mm;border-top:1px solid var(--line);padding-top:2mm;display:flex;justify-content:space-between;font-size:7pt;color:#626d76}.footer-brand{font:700 8pt Arial,sans-serif;direction:ltr}
@media(max-width:700px){.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:span 2}.toolbar strong{width:100%}.catalog{padding:0 5px}.catalog-page{transform:scale(calc((100vw - 10px) / 793.7));transform-origin:top center;margin-bottom:calc(-297mm + (100vw - 10px) * 1.4142 + 14px)}}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar,.hint,.workspace{display:none!important}.catalog{display:block!important;max-width:none;margin:0;padding:0}.catalog-page{margin:0;box-shadow:none}.section-title{height:7mm}@page{size:A4 portrait;margin:0}}
</style>
</head>
<body>
<div class="toolbar">
<strong>نموذج كاتلوج GLOBAL</strong>
<button class="btn red" onclick="addProduct()">＋ إضافة صنف</button>
<button class="btn" onclick="window.print()">طباعة / حفظ PDF</button>
<button class="btn light" onclick="exportData()">تصدير البيانات</button>
<button class="btn light" onclick="document.getElementById('import-file').click()">استيراد بيانات</button>
<button class="btn light" onclick="saveNow()">حفظ الآن</button>
<input id="import-file" type="file" accept=".json,application/json" hidden onchange="importData(event)">
</div>
<p class="hint">املأ بيانات الأصناف وارفع صورة لكل صنف. يطبع النموذج 6 أصناف في الصفحة. تُحفظ التعديلات تلقائيًا في هذا المتصفح؛ استخدم «تصدير البيانات» للاحتفاظ بنسخة احتياطية أو نقلها.</p>
<div class="workspace"><label>عنوان القسم للمعاينة والطباعة: <input id="section-name" class="catalog-section-input" value="كتالوج المنتجات" oninput="renderCatalog()"></label><div id="editors"></div><div id="empty-state" class="empty">لا توجد أصناف بعد. اضغط «إضافة صنف» للبدء.</div></div>
<div id="catalog" class="catalog"></div>
<script>
const KEY='global-catalog-template-v1';let products=[];let saveTimer;
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return safe(s)}
function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{products=[]}renderEditors()}
function saveNow(){localStorage.setItem(KEY,JSON.stringify(products));toast('تم حفظ البيانات في هذا المتصفح')}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(products)),350)}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style='position:fixed;bottom:16px;left:16px;background:#142333;color:white;padding:9px 14px;border-radius:7px;z-index:30';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function addProduct(data={}){products.push({id:uid(),code:'',nameAr:'',nameEn:'',unit:'وحدة',measurements:'',cost:'',bulk:'',wholesale:'',retail:'',pcs:'10',currency:'ILS',image:'',...data});renderEditors();scheduleSave();renderCatalog();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function update(id,key,value){const p=products.find(x=>x.id===id);if(p){p[key]=value;scheduleSave();renderCatalog()}}
function renderEditors(){const box=document.getElementById('editors');document.getElementById('empty-state').style.display=products.length?'none':'block';box.innerHTML=products.map((p,i)=>`<section class="editor" data-id="${escAttr(p.id)}"><div class="editor-head"><b>${esc(p.code||'رقم الصنف')}</b><strong>الصنف ${i+1}</strong><button class="btn light" onclick="removeProduct('${escAttr(p.id)}')">حذف الصنف</button></div><div class="fields">
<label>رقم الصنف<input data-key="code" value="${escAttr(p.code)}" placeholder="مثال: 700018"></label>
<label class="wide">اسم الصنف بالعربية<input data-key="nameAr" value="${escAttr(p.nameAr)}" placeholder="اسم المنتج"></label>
<label class="wide">اسم المنتج بالإنجليزية (اختياري)<input data-key="nameEn" value="${escAttr(p.nameEn)}" placeholder="Product name"></label>
<label>الوحدة<input data-key="unit" value="${escAttr(p.unit)}" placeholder="وحدة / حبة"></label>
<label>PCS<input data-key="pcs" value="${escAttr(p.pcs)}" placeholder="مثال: 10" inputmode="decimal"></label>
<label class="wide">المقاسات / المواصفات<input data-key="measurements" value="${escAttr(p.measurements)}" placeholder="مثال: 100 مم، 7 بوصة، اللون..."></label>
<label>سعر التكلفة<input data-key="cost" value="${escAttr(p.cost)}" placeholder="اختياري" inputmode="decimal"></label>
<label>جملة الجملة<input data-key="bulk" value="${escAttr(p.bulk)}" placeholder="اختياري" inputmode="decimal"></label>
<label>سعر الجملة<input data-key="wholesale" value="${escAttr(p.wholesale)}" placeholder="اختياري" inputmode="decimal"></label>
<label>سعر القطاعي<input data-key="retail" value="${escAttr(p.retail)}" placeholder="اختياري" inputmode="decimal"></label>
<label>العملة<input data-key="currency" value="${escAttr(p.currency)}" placeholder="ILS"></label>
<label class="wide">صورة المنتج<input class="image-file" type="file" accept="image/*"><span class="image-field">${p.image?'<span>تم تحميل صورة</span><button type="button" class="btn light clear-image">إزالة الصورة</button>':'<span>اختر صورة من جهازك (تُحفظ مع البيانات على هذا المتصفح)</span>'}</span></label>
</div></section>`).join('');box.querySelectorAll('.editor').forEach(el=>{let id=el.dataset.id;el.querySelectorAll('[data-key]').forEach(input=>input.addEventListener('input',e=>update(id,e.target.dataset.key,e.target.value)));el.querySelector('.image-file').addEventListener('change',e=>readImage(e,id));let clear=el.querySelector('.clear-image');if(clear)clear.addEventListener('click',()=>{update(id,'image','');renderEditors()})})}
function readImage(event,id){const f=event.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);update(id,'image',c.toDataURL('image/jpeg',.86));renderEditors();renderCatalog();toast('تم تحميل صورة المنتج')};im.src=reader.result};reader.readAsDataURL(f)}
function removeProduct(id){if(!confirm('هل تريد حذف هذا الصنف؟'))return;products=products.filter(p=>p.id!==id);scheduleSave();renderEditors();renderCatalog()}
function exportData(){const b=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='global-catalog-data.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v))throw 0;products=v.map(p=>({id:uid(),code:'',nameAr:'',nameEn:'',unit:'وحدة',measurements:'',cost:'',bulk:'',wholesale:'',retail:'',pcs:'10',currency:'ILS',image:'',...p}));scheduleSave();renderEditors();renderCatalog();toast('تم استيراد البيانات')}catch{alert('تعذر قراءة ملف البيانات. اختر ملف JSON تم تصديره من هذا النموذج.')}};r.readAsText(f);e.target.value=''}
function priceLine(label,val){return `<div class="price-row"><span class="price-label">${label}</span><span class="price-value">${safe(val||'—')}</span></div>`}
